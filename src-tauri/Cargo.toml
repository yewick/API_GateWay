[package]
name = "yeapi"
version = "0.1.6"
description = "YeAPi - Local LLM API Gateway"
authors = ["xiaofuge"]
edition = "2021"

[lib]
name = "yeapi_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-store = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

# HTTP Server
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors"] }

# HTTP Client
reqwest = { version = "0.12", features = ["json", "stream"] }
futures-util = "0.3"
async-stream = "0.3"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
sha2 = "0.10"
unpdf = "0.2"
unicode-normalization = "0.1"
bincode = "1.3"

# Database
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio", "chrono", "macros"] }

# Utils
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = "0.3"
rand = "0.9"
dirs = "5"
async-trait = "0.1"
bytes = "1"
walkdir = "2"

# Git 导入（vendored：终端用户无需安装 git / openssl）
git2 = { version = "0.19", default-features = false, features = ["vendored-libgit2", "https", "vendored-openssl"] }

# 代码符号提取（tree-sitter，版本需与各 grammar crate 互配）
tree-sitter = "0.24"
tree-sitter-rust = "0.23"
tree-sitter-python = "0.23"
tree-sitter-typescript = "0.23"
tree-sitter-javascript = "0.23"
tree-sitter-java = "0.23"

# Logging
log = "0.4"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
roxmltree = "0.21.1"
csv = "1.4.0"
html2text = "0.17.1"
calamine = "0.36.1"
